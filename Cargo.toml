[package]
name = "fastvint"
description = "A fast variable-length integer encoding with a focus on speed and no_std support."
documentation = "https://docs.rs/fastvint"
repository = "https://github.com/bbqsrc/fastvint"
version = "1.0.0"
authors = ["Brendan Molloy <brendan@bbqsrc.net>"]
categories = ["algorithms", "compression", "data-structures", "encoding", "no-std"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
futures-io = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["io"], optional = true }
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
proptest = "1.9"
rand = "0.9"
criterion = "0.8.1"

[[bench]]
name = "vlq"
harness = false
required-features = ["bench"]

[[bench]]
name = "comparison"
harness = false
required-features = ["bench"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
async-futures = ["futures-io", "futures-util"]
async-tokio = ["tokio"]
asm = []
bench = []
